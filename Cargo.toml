[workspace]
resolver = "2"
members = [
    "crates/ide",
    "crates/model",
    "crates/codegen",
    "crates/plugins",
    "crates/bpmn",
    "crates/ide-server",
    "xtask",
]
# apps/ide-tauri has its own Cargo.lock and its own dependency tree; it is
# built by .github/workflows/tauri.yml, not by the workspace.
exclude = ["apps/ide-tauri"]

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["chrono", "uuid1", "indexmap2"] }
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2.0", features = ["serde"] }

# Async
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# GUI
egui = "0.29"
egui_extras = "0.29"

# Tauri
tauri = "2.0"
tauri_plugin_dialog = "2.0"
tauri_plugin_fs = "2.0"
tauri_plugin_updater = "2.0"
tauri_plugin_shell = "2.0"

# Web/Backend
axum = { version = "0.7", features = ["ws", "json", "multipart", "form"] }
sea-orm = { version = "0.12", features = ["sqlx-postgres", "sqlx-sqlite", "sqlx-mysql", "chrono", "uuid", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "add-extension"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Codegen
handlebars = "5.0"

# Plugins
wasmtime = { version = "36.0", features = ["component-model", "async"] }

# BPMN
napi = { version = "2.0", features = ["napi6"] }
napi-derive = "2.0"

# xtask
clap = { version = "4.0", features = ["derive"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"