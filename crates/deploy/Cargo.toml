[package]
name = "nocode-deploy"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
nocode-model = { path = "../model" }
nocode-codegen = { path = "../codegen" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tempfile = "3"

# Encryption
chacha20poly1305 = "0.10"
hex = "0.4"
zeroize = "1"
rand = "0.8"

# HTTP client (GitHub REST). TLS is NOT optional: api.github.com is HTTPS,
# and a plain HttpConnector silently fails every real request.
hyper = { version = "1.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
http-body-util = "0.1"
http = "1.0"
