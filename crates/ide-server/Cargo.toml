[package]
name = "nocode-ide-server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "No-Code IDE web server (Axum + SeaORM)"

[[bin]]
name = "nocode-ide-server"
path = "src/main.rs"

[dependencies]
nocode-model = { path = "../model" }
nocode-ide = { path = "../ide" }
nocode-codegen = { path = "../codegen" }
nocode-bpmn = { path = "../bpmn" }
# The WebAssembly plugin host: the sandbox, the manifest validation and the
# module loader.
nocode-plugins = { path = "../plugins" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
sea-orm = { workspace = true }
# Not referenced by name anywhere in this crate, but required: SeaORM's
# `sqlx-*` driver features do not select an async runtime, so without this the
# pooled driver panics at runtime with "either the `runtime-async-std` or
# `runtime-tokio` feature must be enabled". The drivers themselves come from
# SeaORM's features.
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# Preview subsystem: static serving + HTTP/1.1 reverse proxy to the generated app
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.4", features = ["util"] }
bytes = "1"

# Auth
argon2 = "0.5"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
# `tower` (util) and `bytes` are already regular dependencies above.
