[dist]
# cargo-dist configuration for the No-Code IDE CLI/xtask binary.
# Regenerate the GitHub Actions workflow with: cargo dist init
cargo-dist-version = "0.22.1"
# The binary produced by the xtask package.
rust-toolchain-version = "stable"
ci = "github"

# Targets to build release artifacts for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Installers to generate alongside the archives.
installers = ["shell", "powershell", "homebrew"]

# Package that owns the distributable binary.
[dist.packages]
nocode-xtask = ""

# Source archives are not needed; we ship binaries only.
[dist.package.metadata]
repository = "https://github.com/nocode-ide/nocode-ide"
